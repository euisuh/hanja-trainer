name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: github.event_name == 'pull_request'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migrations.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-screenshots
          path: test-results*/
