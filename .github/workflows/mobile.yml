name: Mobile builds

# Run native builds only when something that reaches the apps changes.
# Signing and store uploads are not here.
on:
  push:
    branches: [main]
    paths: &mobile-paths
      - android/**
      - ios/**
      - src/**
      - shared/**
      - index.html
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - vite.config.ts
      - .github/workflows/mobile.yml
  pull_request:
    paths: *mobile-paths

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_CACHE: ${{ github.workspace }}/../.ci-cache/npm

jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../.ci-cache/android-sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/../.ci-cache/gradle
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - run: npm ci
      # Same bundle as `npm run build:mobile`, syncing only the platform this runner builds.
      - run: npx vite build && npx cap sync android
        env:
          VITE_API_ORIGIN: https://hanja.uiseoya.com
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npx vite build && npx cap sync ios
        env:
          VITE_API_ORIGIN: https://hanja.uiseoya.com
      - run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -derivedDataPath build/ios -packageAuthorizationProvider netrc
          CODE_SIGNING_ALLOWED=NO build
